{% extends 'pages/base.html' %}

{% block content %}
<h1>Delete Area</h1>

<form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete "{{ area.area_name }}"?</p>
    <button type="submit">Confirm Delete</button>
</form>

<p><a href="{% url 'arealist' %}">Back to Areas</a></p>
{% endblock %}
